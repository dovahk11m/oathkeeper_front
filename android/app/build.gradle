plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Load properties from local.properties
def localProperties = new Properties()
// 'android/local.properties' 경로를 정확히 지정하는 것이 중요합니다.
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
} else {
    // 파일을 찾지 못했을 경우 빌드 실패를 방지하기 위해 빈 값을 할당 (CI/CD 환경 등을 위함)
    println("Warning: local.properties file not found at " + localPropertiesFile.absolutePath)
    localProperties.setProperty('KAKAO_NATIVE_APP_KEY', '')
    localProperties.setProperty('FACEBOOK_APP_ID', '')
    localProperties.setProperty('FACEBOOK_CLIENT_TOKEN', '')
    localProperties.setProperty('NAVER_MAPS_CLIENT_ID', '')
}

android {
    namespace = "com.oath.oath_client"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.oath.oath_client"
        //flutter.minSdkVersion
        minSdkVersion 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        multiDexEnabled true

        // Manifest 파일에서 사용할 모든 변수를 여기서 정의하고, local.properties에서 값을 가져옵니다.
        manifestPlaceholders = [
                KAKAO_NATIVE_APP_KEY    : localProperties.getProperty('KAKAO_NATIVE_APP_KEY', ''),
                FACEBOOK_APP_ID         : localProperties.getProperty('FACEBOOK_APP_ID', ''),
                FACEBOOK_CLIENT_TOKEN   : localProperties.getProperty('FACEBOOK_CLIENT_TOKEN', ''),
                NAVER_MAPS_CLIENT_ID    : localProperties.getProperty('NAVER_MAPS_CLIENT_ID', '')
        ]
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-options"
}
